<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#f8fafc"/>
  
  <!-- Cuff -->
  <ellipse cx="200" cy="180" rx="80" ry="40" fill="#00a8b5" opacity="0.8"/>
  <ellipse cx="200" cy="180" rx="70" ry="30" fill="none" stroke="#003d5c" stroke-width="3"/>
  
  <!-- Pump Bulb -->
  <ellipse cx="300" cy="220" rx="30" ry="20" fill="#003d5c"/>
  <ellipse cx="295" cy="215" rx="25" ry="15" fill="#00a8b5" opacity="0.3"/>
  
  <!-- Tube -->
  <path d="M270 220 Q240 210, 220 190" stroke="#374151" stroke-width="4" fill="none"/>
  
  <!-- Monitor Display -->
  <rect x="120" y="260" width="160" height="80" rx="8" fill="#374151"/>
  <rect x="130" y="270" width="140" height="60" rx="4" fill="#1f2937"/>
  
  <!-- Digital Display -->
  <text x="200" y="295" text-anchor="middle" fill="#00ff00" font-family="monospace" font-size="16" font-weight="bold">
    120/80
  </text>
  <text x="200" y="315" text-anchor="middle" fill="#00ff00" font-family="monospace" font-size="12">
    mmHg
  </text>
  
  <!-- Control Buttons -->
  <circle cx="150" cy="350" r="8" fill="#6b7280"/>
  <circle cx="180" cy="350" r="8" fill="#6b7280"/>
  <circle cx="220" cy="350" r="8" fill="#6b7280"/>
  <circle cx="250" cy="350" r="8" fill="#6b7280"/>
  
  <!-- Brand Label -->
  <text x="200" y="50" text-anchor="middle" fill="#003d5c" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    ALTHEA SYSTEMS
  </text>
  
  <!-- Product Label -->
  <text x="200" y="380" text-anchor="middle" fill="#6b7280" font-family="Arial, sans-serif" font-size="12">
    Tensiomètre Digital
  </text>
</svg>