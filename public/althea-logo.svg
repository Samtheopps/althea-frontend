<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00a8b5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003d5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradientLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4f4f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Version couleur (défaut) -->
  <g id="logo-color">
    <!-- Icône médicale stylisée -->
    <circle cx="25" cy="30" r="20" fill="url(#logoGradient)" opacity="0.1"/>
    <path d="M15 30 L25 20 L35 30 L25 40 Z" fill="url(#logoGradient)" opacity="0.8"/>
    <circle cx="25" cy="30" r="3" fill="#ffffff"/>
    
    <!-- Texte principal -->
    <text x="50" y="25" font-family="Poppins, sans-serif" font-weight="700" font-size="16" fill="url(#logoGradient)">
      Althea
    </text>
    <text x="50" y="42" font-family="Poppins, sans-serif" font-weight="600" font-size="14" fill="url(#logoGradient)">
      Systems
    </text>
  </g>
  
  <!-- Version pour fond sombre (masquée par défaut) -->
  <g id="logo-light" style="display: none">
    <!-- Icône médicale stylisée -->
    <circle cx="25" cy="30" r="20" fill="url(#logoGradientLight)" opacity="0.2"/>
    <path d="M15 30 L25 20 L35 30 L25 40 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="25" cy="30" r="3" fill="#00a8b5"/>
    
    <!-- Texte principal -->
    <text x="50" y="25" font-family="Poppins, sans-serif" font-weight="700" font-size="16" fill="#ffffff">
      Althea
    </text>
    <text x="50" y="42" font-family="Poppins, sans-serif" font-weight="600" font-size="14" fill="#ffffff">
      Systems
    </text>
  </g>
</svg>
