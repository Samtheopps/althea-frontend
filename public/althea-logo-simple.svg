<svg width="180" height="40" viewBox="0 0 180 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00a8b5"/>
      <stop offset="100%" style="stop-color:#003d5c"/>
    </linearGradient>
  </defs>
  
  <!-- Version normal -->
  <g class="logo-normal">
    <text x="0" y="25" font-family="Poppins, sans-serif" font-weight="700" font-size="18" fill="url(#gradient)">
      Althea Systems
    </text>
  </g>
  
  <!-- Version pour fond sombre -->
  <g class="logo-dark" style="display: none">
    <text x="0" y="25" font-family="Poppins, sans-serif" font-weight="700" font-size="18" fill="#ffffff">
      Althea Systems
    </text>
  </g>
</svg>
